name: Keep HF Space awake
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping public demo
        run: |
          if [ -z "${{ vars.HF_SPACE_URL }}" ]; then
            echo "HF_SPACE_URL is not configured; skipping."
            exit 0
          fi
          curl -fsS --max-time 30 "${{ vars.HF_SPACE_URL }}/api/health"
